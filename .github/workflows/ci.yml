name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One step per gate stage so a red X names exactly what failed. These are the
  # same npm scripts `npm run build` composes locally — single source of truth,
  # no drift between local and CI.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json # reads engines.node (24.x)
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build site
        run: npm run build:site
      - name: Check links
        run: npm run check:links
      - name: Check llms.txt
        run: npm run check:llms-txt

  # Static security scan (Semgrep's free OWASP Top 10 ruleset). Runs in parallel
  # with build. `--error` makes findings fail the job so it's a real signal, not
  # log noise. Not yet a required check — promote it in branch protection once
  # it's confirmed clean on this codebase.
  #
  # Runs in Semgrep's own image at a pinned version rather than `pip install`
  # on the runner's Python: Python 3.15 segfaults semgrep-core, and an
  # unpinned install silently changes the scanner under us. Bump deliberately.
  security:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.184.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Semgrep OWASP Top 10
        run: semgrep scan --config p/owasp-top-ten --error
